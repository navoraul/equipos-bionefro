<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Etiquetas QR — Equipos de planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#1b1e20;
    --panel:#24282b;
    --panel-2:#2e3336;
    --text:#f0ede4;
    --text-dim:#9aa3a8;
    --yellow:#f5c518;
    --red:#e0483c;
    --green:#4ca871;
    --border:#3a3f42;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:600;
    margin:0;
  }
  code,.mono,.tag-code{
    font-family:'IBM Plex Mono',monospace;
  }
  a{color:var(--yellow);}
  button{font-family:inherit;}

  /* --- signature: hazard stripe --- */
  .hazard{
    height:10px;
    background:repeating-linear-gradient(45deg,
      var(--yellow) 0 16px,
      #1b1e20 16px 32px);
  }
  .hazard.thin{height:6px;}

  /* ---------- shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{
    width:34px;height:34px;background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    color:#1b1e20;font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;
    border-radius:2px;
  }
  .brand h1{font-size:18px;color:var(--text);}
  .brand .sub{font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .nav-tabs{display:flex;gap:2px;}
  .nav-tabs button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
    border-radius:var(--radius);
  }
  .nav-tabs button.active{background:var(--yellow);color:#1b1e20;border-color:var(--yellow);font-weight:600;}

  main{flex:1;padding:28px;max-width:1180px;width:100%;margin:0 auto;}
  .hidden{display:none !important;}

  /* ---------- admin layout ---------- */
  .grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start;}
  @media (max-width:900px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .card-head{
    padding:14px 18px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .card-head h2{font-size:14px;color:var(--text-dim);}
  .card-body{padding:18px;}

  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=date],textarea,select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;font-size:13.5px;border-radius:var(--radius);font-family:inherit;
  }
  textarea{resize:vertical;min-height:56px;}
  input:focus,textarea:focus,select:focus,button:focus-visible{
    outline:2px solid var(--yellow);outline-offset:1px;
  }
  .hint{font-size:11px;color:var(--text-dim);margin-top:5px;}

  .list-field .row{display:flex;gap:8px;margin-bottom:8px;}
  .list-field input{flex:1;}
  .icon-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    width:34px;flex-shrink:0;cursor:pointer;border-radius:var(--radius);font-size:15px;
  }
  .icon-btn:hover{color:var(--red);border-color:var(--red);}
  .add-line{
    background:none;border:1px dashed var(--border);color:var(--text-dim);
    padding:7px;width:100%;cursor:pointer;font-size:12px;border-radius:var(--radius);margin-top:2px;
  }
  .add-line:hover{color:var(--yellow);border-color:var(--yellow);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--yellow);color:#1b1e20;border:none;
    padding:11px 18px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    cursor:pointer;border-radius:var(--radius);width:100%;margin-top:18px;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);width:auto;margin:0;}
  .btn.small{width:auto;padding:7px 12px;font-size:11px;margin:0;}
  .btn.danger{background:var(--red);color:#fff;}

  .toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}

  .equip-list{display:flex;flex-direction:column;gap:10px;}
  .equip-item{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    display:flex;align-items:center;gap:14px;padding:12px 14px;
  }
  .equip-item .qr-thumb{
    width:64px;height:64px;background:#fff;padding:6px;flex-shrink:0;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
  }
  .equip-item .qr-thumb img,.equip-item .qr-thumb canvas{width:100%;height:100%;}
  .equip-item .info{flex:1;min-width:0;}
  .equip-item .info .code{color:var(--yellow);font-size:11px;}
  .equip-item .info .name{font-size:15px;font-weight:600;}
  .equip-item .info .meta{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .equip-item .actions{display:flex;gap:6px;}
  .warn-count{color:var(--red);}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .empty-state .mark{font-size:34px;margin-bottom:10px;}

  /* ---------- print sheet ---------- */
  #printSheet{display:none;}
  .print-tag{
    border:1px solid #333;padding:10px;display:flex;gap:12px;align-items:center;
    break-inside:avoid;
  }
  .print-tag .qr{
    width:110px;height:110px;flex-shrink:0;background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .print-tag .txt .code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#555;}
  .print-tag .txt .name{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;font-weight:700;}
  @media print{
    body *{visibility:hidden;}
    #printSheet, #printSheet *{visibility:visible;}
    #printSheet{
      display:grid !important;grid-template-columns:1fr 1fr;gap:12px;
      position:absolute;top:0;left:0;width:100%;padding:20px;
    }
  }

  /* ---------- worker view ---------- */
  #workerView{min-height:100vh;display:flex;flex-direction:column;}
  .w-head{
    background:var(--panel);padding:26px 22px 20px;
  }
  .w-head .eyebrow{font-size:11px;color:var(--text-dim);letter-spacing:.1em;}
  .w-head .tag-code{color:var(--yellow);font-size:13px;margin-top:2px;}
  .w-head h1{font-size:26px;margin-top:8px;line-height:1.15;}
  .w-cat{
    display:inline-block;margin-top:10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--text-dim);border:1px solid var(--border);padding:3px 9px;border-radius:20px;
  }
  .w-body{padding:22px;flex:1;display:flex;flex-direction:column;gap:22px;max-width:640px;margin:0 auto;width:100%;}
  .w-section .label{
    font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .w-section .label .dot{width:7px;height:7px;background:var(--yellow);border-radius:50%;}
  .warn-box{
    background:rgba(224,72,60,.1);border:1px solid var(--red);border-left:4px solid var(--red);
    border-radius:var(--radius);padding:14px 16px;
  }
  .warn-box .label .dot{background:var(--red);}
  .warn-box ul{margin:0;padding-left:18px;}
  .warn-box li{margin-bottom:7px;color:var(--text);}
  .warn-box li:last-child{margin-bottom:0;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:step;}
  .steps li{
    counter-increment:step;position:relative;padding:0 0 14px 34px;
  }
  .steps li:last-child{padding-bottom:0;}
  .steps li::before{
    content:counter(step);position:absolute;left:0;top:0;
    width:22px;height:22px;background:var(--panel-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--yellow);border-radius:2px;
  }
  .maint-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .maint-grid .item{background:var(--panel);border:1px solid var(--border);padding:12px 14px;border-radius:var(--radius);}
  .maint-grid .item .k{font-size:10.5px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.06em;}
  .maint-grid .item .v{font-family:'IBM Plex Mono',monospace;font-size:14px;margin-top:4px;}
  .contact-box{
    background:var(--panel);border:1px solid var(--border);padding:14px 16px;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  }
  .contact-box .v{font-size:15px;font-weight:600;}
  .w-notes{font-size:13.5px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:16px;}
  .w-foot{padding:18px 22px;text-align:center;font-size:11px;color:var(--text-dim);border-top:1px solid var(--border);}
  .w-error{padding:60px 24px;text-align:center;}
  .w-error .mark{font-size:40px;color:var(--red);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--green);
    padding:11px 18px;font-size:13px;border-radius:var(--radius);opacity:0;pointer-events:none;
    transition:all .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;
    z-index:60;padding:20px;
  }
  .modal{background:var(--panel);border:1px solid var(--border);max-width:420px;width:100%;padding:24px;border-radius:var(--radius);}
  .modal h3{font-size:16px;margin-bottom:10px;}
  .modal p{font-size:13.5px;color:var(--text-dim);margin-bottom:20px;}
  .modal .row{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   ETIQUETAS QR — EQUIPOS DE PLANTA
   Herramienta autónoma: todo vive en este archivo HTML.
   Los datos de cada equipo se guardan en el propio código QR
   (codificados en la URL), así que no requiere servidor.
   ========================================================= */

const STORE_KEY = 'planta_equipos_v1';
const BASE_KEY = 'planta_base_url_v1';

function loadEquipos(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; }
}
function saveEquipos(list){
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}
function getBaseUrl(){
  const saved = localStorage.getItem(BASE_KEY);
  if(saved) return saved;
  return location.origin + location.pathname;
}
function setBaseUrl(url){
  localStorage.setItem(BASE_KEY, url);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(){ return 'eq_' + Math.random().toString(36).slice(2,9); }

function encodeEquipo(eq){
  const json = JSON.stringify(eq);
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeEquipo(str){
  try{
    const json = decodeURIComponent(escape(atob(str)));
    return JSON.parse(json);
  }catch(e){ return null; }
}
// URL con TODOS los datos incrustados — cómoda para probar desde el panel,
// pero demasiado "densa" para imprimirse pequeña y escanearse bien.
function previewUrl(eq){
  return getBaseUrl() + '#e=' + encodeEquipo(eq);
}
// URL corta (solo el ID) — esta es la que se usa en el QR que se imprime.
// Un QR corto tiene muchos menos módulos, así que la cámara del teléfono
// lo enfoca y lee mucho más fácil, incluso en etiquetas pequeñas.
function shortTagUrl(eq){
  return getBaseUrl() + '#id=' + encodeURIComponent(eq.id);
}

/* ---------------- routing ---------------- */
function parseRoute(){
  const h = location.hash;
  if(h.startsWith('#e=')) return { type:'embed', data: h.slice(3) };
  if(h.startsWith('#id=')) return { type:'id', data: decodeURIComponent(h.slice(4)) };
  return null;
}

function render(){
  const route = parseRoute();
  if(route){
    renderWorkerView(route);
  }else{
    renderAdmin();
  }
}
window.addEventListener('hashchange', render);

/* ==========================================================
   ADMIN VIEW
   ========================================================== */
let editingId = null;

function renderAdmin(){
  const equipos = loadEquipos();
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="mark">QR</div>
        <div>
          <h1>Etiquetas de equipo</h1>
          <div class="sub">Panel de administración</div>
        </div>
      </div>
      <div class="nav-tabs">
        <button class="active">Administrar</button>
      </div>
    </div>
    <div class="hazard"></div>
    <main>
      <div class="grid">
        <div class="card">
          <div class="card-head"><h2 id="formTitle">Nuevo equipo</h2></div>
          <div class="card-body" id="formArea"></div>
        </div>

        <div>
          <div class="toolbar">
            <button class="btn ghost small" id="btnExport">Exportar equipos.json</button>
            <label class="btn ghost small" style="cursor:pointer;">
              Importar datos (JSON)
              <input type="file" id="importFile" accept="application/json" class="hidden">
            </label>
            <button class="btn ghost small" id="btnPrintAll">Imprimir todas las etiquetas</button>
            <button class="btn ghost small" id="btnBaseUrl">Configurar URL del sitio</button>
          </div>
          <div class="card" style="margin-bottom:16px;border-color:var(--yellow);">
            <div class="card-body" style="padding:14px 16px;font-size:12.5px;color:var(--text-dim);">
              <strong style="color:var(--yellow);">Importante:</strong> los QR impresos solo llevan un código corto. Para que funcionen al escanearse, exporta <span class="mono" style="color:var(--text);">equipos.json</span> y súbelo a la <strong>misma carpeta</strong> que este HTML en tu repositorio de GitHub — cada vez que agregues o edites un equipo.
            </div>
          </div>
          <div id="listArea"></div>
        </div>
      </div>
    </main>
    <div id="printSheet"></div>
  `;

  renderForm();
  renderList(equipos);

  document.getElementById('btnExport').onclick = exportData;
  document.getElementById('importFile').onchange = importData;
  document.getElementById('btnPrintAll').onclick = printAll;
  document.getElementById('btnBaseUrl').onclick = configureBaseUrl;
}

function emptyEquipo(){
  return { id:uid(), codigo:'', nombre:'', categoria:'', advertencias:[''], instrucciones:[''],
           mantUltima:'', mantProxima:'', mantContacto:'', mantTelefono:'', notas:'' };
}

function renderForm(eq){
  eq = eq || emptyEquipo();
  editingId = eq.id && loadEquipos().some(e=>e.id===eq.id) ? eq.id : null;
  document.getElementById('formTitle').textContent = editingId ? 'Editar equipo' : 'Nuevo equipo';

  const area = document.getElementById('formArea');
  area.innerHTML = `
    <label>Código de activo</label>
    <input type="text" id="f_codigo" placeholder="Ej. CNC-014" value="${escapeHtml(eq.codigo)}">

    <label>Nombre del equipo</label>
    <input type="text" id="f_nombre" placeholder="Ej. Torno CNC 014" value="${escapeHtml(eq.nombre)}">

    <label>Categoría / área</label>
    <input type="text" id="f_categoria" placeholder="Ej. Mecanizado" value="${escapeHtml(eq.categoria)}">

    <label>Advertencias de seguridad</label>
    <div class="list-field" id="f_advertencias"></div>
    <button type="button" class="add-line" data-add="advertencias">+ Agregar advertencia</button>

    <label>Instrucciones de uso</label>
    <div class="list-field" id="f_instrucciones"></div>
    <button type="button" class="add-line" data-add="instrucciones">+ Agregar paso</button>

    <label>Última revisión</label>
    <input type="date" id="f_mantUltima" value="${escapeHtml(eq.mantUltima)}">

    <label>Próxima revisión</label>
    <input type="date" id="f_mantProxima" value="${escapeHtml(eq.mantProxima)}">

    <label>Contacto de mantenimiento</label>
    <input type="text" id="f_mantContacto" placeholder="Nombre / turno" value="${escapeHtml(eq.mantContacto)}">

    <label>Teléfono / extensión</label>
    <input type="text" id="f_mantTelefono" placeholder="Ej. Ext. 204" value="${escapeHtml(eq.mantTelefono)}">

    <label>Notas adicionales</label>
    <textarea id="f_notas" placeholder="Manual, enlaces, observaciones...">${escapeHtml(eq.notas)}</textarea>

    <button class="btn" id="btnSave">${editingId ? 'Guardar cambios' : 'Crear equipo y generar QR'}</button>
    ${editingId ? '<button class="btn ghost" id="btnCancelEdit" style="width:100%;margin-top:8px;">Cancelar edición</button>' : ''}
  `;

  buildListField('advertencias', eq.advertencias.length ? eq.advertencias : ['']);
  buildListField('instrucciones', eq.instrucciones.length ? eq.instrucciones : ['']);

  area.querySelectorAll('[data-add]').forEach(btn=>{
    btn.onclick = ()=> addListRow(btn.dataset.add);
  });

  document.getElementById('btnSave').onclick = ()=> saveForm(eq.id);
  const cancelBtn = document.getElementById('btnCancelEdit');
  if(cancelBtn) cancelBtn.onclick = ()=> renderForm();
}

function buildListField(field, values){
  const wrap = document.getElementById('f_'+field);
  wrap.innerHTML = '';
  values.forEach(v=> appendListRow(field, v));
}
function appendListRow(field, value){
  const wrap = document.getElementById('f_'+field);
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<input type="text" value="${escapeHtml(value)}" placeholder="${field==='advertencias'?'Ej. Riesgo de atrapamiento — no operar sin guardas':'Ej. Verificar que la guarda esté cerrada'}">
    <button type="button" class="icon-btn" title="Quitar">✕</button>`;
  row.querySelector('.icon-btn').onclick = ()=>{
    if(wrap.children.length>1) row.remove();
    else row.querySelector('input').value='';
  };
  wrap.appendChild(row);
}
function addListRow(field){ appendListRow(field, ''); }

function collectList(field){
  return Array.from(document.querySelectorAll('#f_'+field+' input'))
    .map(i=>i.value.trim()).filter(Boolean);
}

function saveForm(id){
  const codigo = document.getElementById('f_codigo').value.trim();
  const nombre = document.getElementById('f_nombre').value.trim();
  if(!codigo || !nombre){
    showToast('Ingresa al menos código y nombre del equipo');
    return;
  }
  const list = loadEquipos();
  const eq = {
    id: editingId || uid(),
    codigo, nombre,
    categoria: document.getElementById('f_categoria').value.trim(),
    advertencias: collectList('advertencias'),
    instrucciones: collectList('instrucciones'),
    mantUltima: document.getElementById('f_mantUltima').value,
    mantProxima: document.getElementById('f_mantProxima').value,
    mantContacto: document.getElementById('f_mantContacto').value.trim(),
    mantTelefono: document.getElementById('f_mantTelefono').value.trim(),
    notas: document.getElementById('f_notas').value.trim(),
  };
  const idx = list.findIndex(e=>e.id===eq.id);
  if(idx>=0) list[idx]=eq; else list.push(eq);
  saveEquipos(list);
  showToast(editingId ? 'Equipo actualizado' : 'Equipo creado — QR generado');
  renderForm();
  renderList(list);
}

function renderList(equipos){
  const area = document.getElementById('listArea');
  if(!equipos.length){
    area.innerHTML = `<div class="card"><div class="empty-state">
      <div class="mark">▦</div>
      <div>Todavía no hay equipos registrados.<br>Crea el primero con el formulario de la izquierda.</div>
    </div></div>`;
    return;
  }
  area.innerHTML = `<div class="equip-list" id="equipList"></div>`;
  const listEl = document.getElementById('equipList');
  equipos.forEach(eq=>{
    const item = document.createElement('div');
    item.className = 'equip-item';
    item.innerHTML = `
      <div class="qr-thumb" id="thumb_${eq.id}"></div>
      <div class="info">
        <div class="code">${escapeHtml(eq.codigo)}</div>
        <div class="name">${escapeHtml(eq.nombre)}</div>
        <div class="meta">${escapeHtml(eq.categoria || 'Sin categoría')} · ${eq.advertencias.filter(Boolean).length ? '<span class="warn-count">'+eq.advertencias.filter(Boolean).length+' advertencia(s)</span>' : 'Sin advertencias'}</div>
      </div>
      <div class="actions">
        <button class="btn ghost small" data-act="view">Ver</button>
        <button class="btn ghost small" data-act="edit">Editar</button>
        <button class="btn ghost small" data-act="print">Imprimir</button>
        <button class="btn danger small" data-act="delete">Eliminar</button>
      </div>
    `;
    new QRCode(item.querySelector('.qr-thumb'), { text: shortTagUrl(eq), width:52, height:52, correctLevel: QRCode.CorrectLevel.M });

    item.querySelector('[data-act=view]').onclick = ()=> window.open(previewUrl(eq), '_blank');
    item.querySelector('[data-act=edit]').onclick = ()=> renderForm(eq);
    item.querySelector('[data-act=print]').onclick = ()=> printSingle(eq);
    item.querySelector('[data-act=delete]').onclick = ()=> confirmDelete(eq);
    listEl.appendChild(item);
  });
}

function confirmDelete(eq){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>Eliminar equipo</h3>
      <p>Esto eliminará "${escapeHtml(eq.nombre)}" y su etiqueta dejará de funcionar. Esta acción no se puede deshacer.</p>
      <div class="row">
        <button class="btn ghost" id="m_cancel" style="flex:1;">Cancelar</button>
        <button class="btn danger" id="m_ok" style="flex:1;">Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#m_cancel').onclick = ()=> bg.remove();
  bg.querySelector('#m_ok').onclick = ()=>{
    const list = loadEquipos().filter(e=>e.id!==eq.id);
    saveEquipos(list);
    bg.remove();
    showToast('Equipo eliminado');
    renderForm();
    renderList(list);
  };
}

function configureBaseUrl(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>URL pública de este archivo</h3>
      <p>Cuando subas este archivo a un sitio (por ejemplo GitHub Pages o la intranet), pega aquí esa dirección para que los QR apunten correctamente. Se detecta automáticamente si abres el archivo ya desde esa dirección.</p>
      <label>URL base</label>
      <input type="text" id="m_url" value="${escapeHtml(getBaseUrl())}" placeholder="https://miempresa.com/equipos.html">
      <div class="row" style="margin-top:16px;">
        <button class="btn ghost" id="m_cancel" style="flex:1;">Cancelar</button>
        <button class="btn" id="m_ok" style="flex:1;margin-top:0;">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#m_cancel').onclick = ()=> bg.remove();
  bg.querySelector('#m_ok').onclick = ()=>{
    setBaseUrl(bg.querySelector('#m_url').value.trim());
    bg.remove();
    showToast('URL guardada — vuelve a imprimir las etiquetas para aplicarla');
    renderList(loadEquipos());
  };
}

function exportData(){
  const data = JSON.stringify(loadEquipos(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'equipos.json';
  a.click();
  showToast('equipos.json descargado — súbelo a GitHub junto al HTML');
}
function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error();
      saveEquipos(data);
      showToast('Datos importados: ' + data.length + ' equipo(s)');
      renderForm();
      renderList(data);
    }catch(e){
      showToast('El archivo no tiene un formato válido');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function printSingle(eq){
  buildPrintSheet([eq]);
  setTimeout(()=>window.print(), 150);
}
function printAll(){
  const list = loadEquipos();
  if(!list.length){ showToast('No hay equipos para imprimir'); return; }
  buildPrintSheet(list);
  setTimeout(()=>window.print(), 150);
}
function buildPrintSheet(list){
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML = '';
  list.forEach(eq=>{
    const tag = document.createElement('div');
    tag.className = 'print-tag';
    tag.innerHTML = `<div class="qr"></div>
      <div class="txt">
        <div class="code">${escapeHtml(eq.codigo)}</div>
        <div class="name">${escapeHtml(eq.nombre)}</div>
      </div>`;
    new QRCode(tag.querySelector('.qr'), { text: shortTagUrl(eq), width:96, height:96, correctLevel: QRCode.CorrectLevel.Q });
    sheet.appendChild(tag);
  });
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ==========================================================
   WORKER VIEW  (lo que ve el trabajador al escanear el QR)
   ========================================================== */
function renderWorkerView(route){
  if(route.type === 'embed'){
    const eq = decodeEquipo(route.data);
    if(!eq){ renderWorkerError('Etiqueta no válida', 'No se pudo leer la información de este equipo. Contacta a mantenimiento.'); return; }
    renderWorkerCard(eq);
    return;
  }

  // route.type === 'id' → el QR solo trae el identificador.
  // Buscamos los datos en equipos.json, publicado junto a este archivo.
  renderWorkerLoading();
  fetch('./equipos.json', { cache:'no-store' })
    .then(res=>{
      if(!res.ok) throw new Error('missing-file');
      return res.json();
    })
    .then(list=>{
      const eq = Array.isArray(list) ? list.find(e=> e.id === route.data || e.codigo === route.data) : null;
      if(!eq) throw new Error('not-found');
      renderWorkerCard(eq);
    })
    .catch(err=>{
      if(err.message === 'not-found'){
        renderWorkerError('Equipo no encontrado', 'Este código ya no está registrado. Contacta a mantenimiento para confirmar el equipo.');
      }else{
        renderWorkerError(
          'No se encontró equipos.json',
          'El sitio aún no tiene publicado el archivo de datos. En el panel, exporta "equipos.json" y súbelo a la misma carpeta que este archivo HTML en tu repositorio.'
        );
      }
    });
}

function renderWorkerLoading(){
  document.getElementById('app').innerHTML = `
    <div id="workerView">
      <div class="hazard"></div>
      <div class="w-error"><p style="color:var(--text-dim);">Cargando ficha del equipo…</p></div>
    </div>`;
}

function renderWorkerError(title, msg){
  document.getElementById('app').innerHTML = `
    <div id="workerView">
      <div class="hazard"></div>
      <div class="w-error">
        <div class="mark">⚠</div>
        <h1 style="margin-top:14px;">${escapeHtml(title)}</h1>
        <p style="color:var(--text-dim);margin-top:8px;">${escapeHtml(msg)}</p>
      </div>
    </div>`;
}

function renderWorkerCard(eq){
  const app = document.getElementById('app');
  const advertencias = (eq.advertencias||[]).filter(Boolean);
  const pasos = (eq.instrucciones||[]).filter(Boolean);

  app.innerHTML = `
    <div id="workerView">
      <div class="hazard"></div>
      <div class="w-head">
        <div class="eyebrow">Ficha de equipo</div>
        <div class="tag-code">${escapeHtml(eq.codigo)}</div>
        <h1>${escapeHtml(eq.nombre)}</h1>
        ${eq.categoria ? `<span class="w-cat">${escapeHtml(eq.categoria)}</span>` : ''}
      </div>

      <div class="w-body">
        ${advertencias.length ? `
        <div class="w-section warn-box">
          <div class="label"><span class="dot"></span>Advertencias de seguridad</div>
          <ul>${advertencias.map(a=>`<li>${escapeHtml(a)}</li>`).join('')}</ul>
        </div>` : ''}

        ${pasos.length ? `
        <div class="w-section">
          <div class="label"><span class="dot"></span>Instrucciones de uso</div>
          <ol class="steps">${pasos.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol>
        </div>` : ''}

        ${(eq.mantUltima || eq.mantProxima) ? `
        <div class="w-section">
          <div class="label"><span class="dot"></span>Mantenimiento</div>
          <div class="maint-grid">
            ${eq.mantUltima ? `<div class="item"><div class="k">Última revisión</div><div class="v">${escapeHtml(eq.mantUltima)}</div></div>` : ''}
            ${eq.mantProxima ? `<div class="item"><div class="k">Próxima revisión</div><div class="v">${escapeHtml(eq.mantProxima)}</div></div>` : ''}
          </div>
        </div>` : ''}

        ${(eq.mantContacto || eq.mantTelefono) ? `
        <div class="w-section">
          <div class="label"><span class="dot"></span>Contacto de mantenimiento</div>
          <div class="contact-box">
            <div class="v">${escapeHtml(eq.mantContacto || 'Mantenimiento')}</div>
            ${eq.mantTelefono ? `<div class="mono">${escapeHtml(eq.mantTelefono)}</div>` : ''}
          </div>
        </div>` : ''}

        ${eq.notas ? `<div class="w-notes">${escapeHtml(eq.notas)}</div>` : ''}
      </div>
      <div class="w-foot">Escanea la etiqueta del equipo para ver esta ficha en cualquier momento.</div>
    </div>
  `;
}

render();
</script>
</body>
</html>
